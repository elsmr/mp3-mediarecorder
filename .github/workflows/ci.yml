name: CI

on:
    push:
        branches: [master]
    pull_request:

jobs:
    checks:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: oven-sh/setup-bun@v2
            - run: bun install --frozen-lockfile
            - run: bun run format:check
            - run: bun run lint
            - run: bun run tsc
            - run: bun test
            - run: bun run build
            - run: bun run size
