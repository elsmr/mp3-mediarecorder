<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>MP3 MediaRecorder</title>
        <link href="https://fonts.googleapis.com/css?family=Press+Start+2P" rel="stylesheet" />
        <link href="https://cdn.jsdelivr.net/npm/nes.css@2.3.0/css/nes.min.css" rel="stylesheet" />
        <link href="style.css" rel="stylesheet" />
        <link rel="shortcut icon" href="favicon.ico" />
    </head>

    <body>
        <main id="main">
            <h1>MP3 MediaRecorder</h1>
            <p id="error" class="nes-container is-rounded nes-text is-error" hidden></p>
            <p id="status" class="status" data-state="inactive">
                <span class="dot"></span><span id="status-text">Ready</span><span id="duration">00:00</span>
            </p>
            <section class="nes-container with-title" id="recordings">
                <h2 class="title">Recordings</h2>
            </section>
            <div class="controls">
                <div>
                    <button class="nes-btn is-primary" id="record">Record</button>
                </div>
                <div>
                    <button class="nes-btn is-error is-disabled" id="stop" disabled>Stop</button>
                </div>
                <div>
                    <button class="nes-btn is-disabled" id="resume" disabled>Resume</button>
                </div>
                <div>
                    <button class="nes-btn is-disabled" id="pause" disabled>Pause</button>
                </div>
            </div>
        </main>
    </body>
    <script type="module" src="./index.js"></script>
</html>
